packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  '@opentelemetry/core@<2.8.0': '2.8.0'
  'cookie@<0.7.0': '0.7.2'
  'engine.io@<6.6.7': '6.6.7'
  'postcss@<8.5.10': '8.5.19'
  'ws@>=8.0.0 <8.21.0': '8.21.1'

allowBuilds:
  '@depot/cli': false
  esbuild: true
  sharp: true
  spawn-sync: false
  unrs-resolver: true
