name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, builds, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WXT_PUBLIC_API_BASE_URL: https://comic-code-ci.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @comic-code/web build
      - run: pnpm typecheck
      - run: pnpm --filter @comic-code/extension zip
      - run: pnpm audit --prod
